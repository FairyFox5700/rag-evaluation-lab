[project]
name = "rag-eval-lab"
version = "0.1.0"
description = "A reproducible RAG evaluation lab with LangChain, OpenAI, and DeepEval"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "deepeval>=4.2.6",
  "langchain>=1.4.2",
  "langchain-openai>=1.6.6",
  "langchain-text-splitters>=1.1.2",
  "numpy>=2.2",
  "pydantic>=2.10",
  "pymupdf>=1.25",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
rag-eval = "rag_eval_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
